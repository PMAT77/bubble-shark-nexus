# Debian 12 static hosting. Public files live directly inside this root.
# For domain hosting, replace _ with the actual domain before adding HTTPS.
server {
    listen 80;
    server_name _;

    root /var/www/bubbleshark-nexus;
    index index.html;
    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Missing JS, WASM or content data must remain a real 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }
}
